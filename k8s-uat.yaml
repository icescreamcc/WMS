apiVersion: apps/v1
kind: Deployment
metadata:
  name:  SYSTEM_NAME-deployment
spec:
  selector:
    matchLabels:
      app:  SYSTEM_NAME
  replicas: 1
  template:
    metadata:
      labels:
        app:   SYSTEM_NAME
    spec:
      containers:
      - name:   SYSTEM_NAME
        image:  IMAGE_NAME
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 1
            memory: 4Gi 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: TZ
          value: Asia/Shanghai
---
apiVersion: v1
kind: Service
metadata:
  name:   SYSTEM_NAME-service
spec:
  selector:
    app:   SYSTEM_NAME
  ports:
  - port: 80
    targetPort: 80