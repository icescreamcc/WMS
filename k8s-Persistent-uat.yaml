apiVersion: v1  
kind: PersistentVolumeClaim  
metadata:  
  name: shared-pvc  
spec:  
  accessModes:  
    - ReadWriteOnce # 允许多个节点以读写权限挂载  
  resources:  
    requests:  
      storage:  STORAGE_SIZE # 请求的存储大小
  storageClassName: topolvm-provisioner
--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name:  SYSTEM_NAME-deployment
spec:
  selector:
    matchLabels:
      app:  SYSTEM_NAME
  replicas: 1
  template:
    metadata:
      labels:
        app:   SYSTEM_NAME
    spec:
      containers:
      - name:   SYSTEM_NAME
        image:  IMAGE_NAME
        volumeMounts:  
        - name: shared-volume  
          mountPath: MOUNT_PATH
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 2
            memory: 4Gi 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: TZ
          value: Asia/Shanghai
      volumes:  
      - name: shared-volume  
        persistentVolumeClaim:  
          claimName: shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name:   SYSTEM_NAME-service
spec:
  selector:
    app:   SYSTEM_NAME
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name:   SYSTEM_NAME-ingress
spec:
  ingressClassName: nginx
  rules:
    - host:   MAIN_DOMAIN 
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name:   SYSTEM_NAME-service
                port:
                  number: 80
            path: /